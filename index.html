<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teorema de Pitágoras</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #071952,
                #088395,
                #37B7C3,
                #EBF4F6
            );

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* =========================
           FONDO ANIMADO
        ========================= */

        .fondo {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;

            overflow: hidden;

            z-index: 0;
        }


        /* CÍRCULOS */

        .circulo {
            position: absolute;

            border-radius: 50%;

            opacity: 0.45;

            animation: flotar 8s infinite ease-in-out;
        }


        .circulo1 {
            width: 150px;
            height: 150px;

            background: #ff4ecd;

            top: 5%;
            left: 5%;
        }


        .circulo2 {
            width: 100px;
            height: 100px;

            background: #ffe66d;

            bottom: 10%;
            right: 8%;

            animation-delay: 2s;
        }


        .circulo3 {
            width: 180px;
            height: 180px;

            background: #7c4dff;

            top: 60%;
            left: 15%;

            animation-delay: 4s;
        }


        /* CUADRADOS */

        .cuadrado {
            position: absolute;

            width: 100px;
            height: 100px;

            opacity: 0.35;

            animation: girar 10s infinite linear;
        }


        .cuadrado1 {
            background: #ff6b6b;

            top: 15%;
            right: 10%;

            transform: rotate(20deg);
        }


        .cuadrado2 {
            background: #00f5d4;

            bottom: 15%;
            left: 5%;

            animation-duration: 15s;
        }


        /* TRIÁNGULOS */

        .figura-triangulo {
            position: absolute;

            width: 0;
            height: 0;

            border-left: 70px solid transparent;
            border-right: 70px solid transparent;
            border-bottom: 120px solid #ff9f1c;

            opacity: 0.45;

            animation: flotar 7s infinite ease-in-out;
        }


        .triangulo1 {
            top: 10%;
            left: 45%;
        }


        .triangulo2 {
            bottom: 5%;
            right: 30%;

            border-bottom-color: #00bbf9;

            animation-delay: 3s;
        }


        /* =========================
           FÓRMULAS FLOTANTES
        ========================= */

        .formula {
            position: absolute;

            color: white;

            font-size: 28px;

            font-weight: bold;

            opacity: 0.35;

            animation: moverFormula 12s infinite linear;
        }


        .formula1 {
            top: 20%;
            left: 20%;
        }


        .formula2 {
            bottom: 20%;
            right: 15%;

            animation-delay: 3s;
        }


        .formula3 {
            top: 70%;
            right: 35%;

            animation-delay: 6s;
        }


        /* =========================
           CAJA PRINCIPAL
        ========================= */

        .caja {

            position: relative;

            z-index: 5;

            background: rgba(255, 255, 255, 0.96);

            width: 430px;

            padding: 30px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);

            border: 3px solid rgba(255,255,255,0.7);

            animation: aparecer 1s ease;
        }


        h1 {

            margin-top: 0;

            color: #071952;

            font-size: 30px;
        }


        .subtitulo {

            color: #555;

            font-size: 16px;
        }


        /* =========================
           TRIÁNGULO CENTRAL
        ========================= */

        .triangulo-central {

            width: 0;

            height: 0;

            border-left: 110px solid transparent;

            border-bottom: 110px solid #2196f3;

            margin: 25px auto;

            filter:
                drop-shadow(
                    5px 5px 5px rgba(0,0,0,0.3)
                );
        }


        .formula-central {

            font-size: 25px;

            font-weight: bold;

            color: #7c4dff;

            margin: 20px;
        }


        /* =========================
           CAMPOS
        ========================= */

        label {

            display: block;

            font-weight: bold;

            color: #071952;

            margin-top: 15px;
        }


        input {

            width: 220px;

            padding: 12px;

            margin-top: 7px;

            border: 2px solid #37B7C3;

            border-radius: 10px;

            font-size: 17px;

            text-align: center;

            outline: none;
        }


        input:focus {

            border-color: #7c4dff;

            box-shadow:
                0 0 10px rgba(124,77,255,0.4);
        }


        /* =========================
           BOTÓN
        ========================= */

        button {

            margin-top: 25px;

            padding: 14px 25px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #7c4dff,
                    #2196f3
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {

            transform: scale(1.08);

            box-shadow:
                0 8px 20px rgba(0,0,0,0.25);
        }


        /* =========================
           RESULTADO
        ========================= */

        #resultado {

            margin-top: 25px;

            font-size: 21px;

            font-weight: bold;

            color: #071952;

            min-height: 30px;
        }


        /* =========================
           ANIMACIONES
        ========================= */

        @keyframes flotar {

            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-35px);
            }

            100% {
                transform: translateY(0px);
            }
        }


        @keyframes girar {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        @keyframes moverFormula {

            0% {
                transform: translateX(-30px);
            }

            50% {
                transform: translateX(30px);
            }

            100% {
                transform: translateX(-30px);
            }
        }


        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.9);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         FONDO
    ========================= -->

    <div class="fondo">

        <div class="circulo circulo1"></div>

        <div class="circulo circulo2"></div>

        <div class="circulo circulo3"></div>


        <div class="cuadrado cuadrado1"></div>

        <div class="cuadrado cuadrado2"></div>


        <div class="figura-triangulo triangulo1"></div>

        <div class="figura-triangulo triangulo2"></div>


        <div class="formula formula1">
            π × r²
        </div>

        <div class="formula formula2">
            √(a² + b²)
        </div>

        <div class="formula formula3">
            x + y = z
        </div>

    </div>


    <!-- =========================
         PROGRAMA
    ========================= -->

    <div class="caja">

        <h1>
            📐 Teorema de Pitágoras
        </h1>


        <p class="subtitulo">
            Calcula la hipotenusa de un
            triángulo rectángulo
        </p>


        <div class="triangulo-central"></div>


        <div class="formula-central">

            a² + b² = c²

        </div>


        <label>
            Cateto A
        </label>


        <input
            type="text"
            id="catetoA"
            placeholder="Escribe un número"
        >


        <label>
            Cateto B
        </label>


        <input
            type="text"
            id="catetoB"
            placeholder="Escribe un número"
        >


        <br>


        <button onclick="calcular()">

            CALCULAR HIPOTENUSA

        </button>


        <div id="resultado"></div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function calcular() {


            let a = parseFloat(
                document.getElementById("catetoA").value
            );


            let b = parseFloat(
                document.getElementById("catetoB").value
            );


            /* COMPROBAR DATOS */

            if (isNaN(a) || isNaN(b)) {

                document.getElementById("resultado").innerHTML =
                    "⚠️ Escribe los dos números.";

                return;
            }


            /* EVITAR CERO Y NEGATIVOS */

            if (a <= 0 || b <= 0) {

                document.getElementById("resultado").innerHTML =
                    "⚠️ Los números deben ser mayores que 0.";

                return;
            }


            /* CALCULAR */

            let c = Math.sqrt(
                (a * a) + (b * b)
            );


            /* MOSTRAR RESULTADO */

            document.getElementById("resultado").innerHTML =
                "✅ La hipotenusa es: " + c.toFixed(2);

        }

    </script>


</body>

</html>
